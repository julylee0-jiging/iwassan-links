<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アラフィフのいわっさん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Shippori+Mincho:wght@400;600;800&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #141417;
    --border: rgba(255,255,255,0.07);
    --gold: #c9a84c;
    --gold-light: #e8cc82;
    --text: #e8e4dc;
    --text-muted: #888880;
    --blue: #3A7DC9;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% -10%, rgba(201,168,76,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(58,125,201,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 48px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0.9;
  }

  .avatar-wrap {
    position: relative;
    width: 88px;
    height: 88px;
    margin: 0 auto 20px;
  }

  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--gold) 0deg, var(--gold-light) 90deg, var(--gold) 180deg, rgba(201,168,76,0.2) 270deg, var(--gold) 360deg);
    animation: spin 8s linear infinite;
  }

  .avatar-inner {
    position: relative;
    z-index: 1;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    overflow: hidden;
  }

  .name {
    font-family: 'Shippori Mincho', serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.08em;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .name span {
    color: var(--gold-light);
  }

  .tagline {
    font-family: 'Noto Serif JP', serif;
    font-size: 11.5px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    line-height: 1.7;
  }

  /* Divider */
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
    animation: fadeIn 1s 0.3s both;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    opacity: 0.3;
  }
  .divider-icon {
    color: var(--gold);
    font-size: 14px;
    opacity: 0.5;
  }

  /* Link cards */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.06) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .link-card:hover {
    border-color: rgba(201,168,76,0.35);
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(201,168,76,0.15);
  }

  .link-card:hover::before { opacity: 1; }

  .link-card:nth-child(1) { animation-delay: 0.2s; }
  .link-card:nth-child(2) { animation-delay: 0.3s; }
  .link-card:nth-child(3) { animation-delay: 0.4s; }
  .link-card:nth-child(4) { animation-delay: 0.5s; }
  .link-card:nth-child(5) { animation-delay: 0.6s; }

  .link-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
    position: relative;
    z-index: 1;
  }

  .link-icon svg {
    width: 22px;
    height: 22px;
  }

  .icon-yt    { background: rgba(255,0,0,0.12); }
  .icon-yt2   { background: rgba(255,80,0,0.12); }
  .icon-note  { background: rgba(255,255,255,0.07); }
  .icon-ig    { background: rgba(193,53,132,0.12); }
  .icon-x     { background: rgba(255,255,255,0.07); }

  .link-text {
    flex: 1;
    position: relative;
    z-index: 1;
  }

  .link-platform {
    font-family: 'Cormorant Garamond', serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .link-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: 0.04em;
    line-height: 1.4;
  }

  .link-arrow {
    position: relative;
    z-index: 1;
    color: var(--text-muted);
    font-size: 16px;
    transition: transform 0.3s, color 0.3s;
  }
  .link-card:hover .link-arrow {
    transform: translateX(3px);
    color: var(--gold);
  }

  /* Footer */
  .footer {
    margin-top: 44px;
    text-align: center;
    animation: fadeIn 1s 0.8s both;
  }

  .footer-line {
    width: 40px;
    height: 1px;
    background: var(--gold);
    opacity: 0.3;
    margin: 0 auto 14px;
  }

  .footer-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    font-weight: 300;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
